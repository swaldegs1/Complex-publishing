<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Complete (Example)</title>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      .container {
        display: grid;
        grid-template-columns: 190px 1fr;
        height: 100vh;
      }
      iframe {
        border: none;
        width: 100%;
        height: 100%;
      }
    </style>
    
  </head>
  <body>
    <div class="container">
      <iframe src="content.htm" name="content" title="content"></iframe>
      <iframe src="main.htm" name="main" title="main"></iframe>
    </div>
  </body>
</html>
